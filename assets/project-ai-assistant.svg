<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <circle cx="300" cy="170" r="200" fill="url(#glow)"/>

  <!-- neural network -->
  <g stroke="#c7d2fe" stroke-opacity=".35" stroke-width="1.5">
    <path d="M40 60 L110 110 L60 190 L130 260 M110 110 L150 40 M60 190 L20 250"/>
    <path d="M560 60 L490 120 L540 200 L470 270 M490 120 L450 40 M540 200 L585 260"/>
  </g>
  <g fill="#e0e7ff">
    <circle cx="40" cy="60" r="5"/><circle cx="110" cy="110" r="7"/><circle cx="60" cy="190" r="6"/>
    <circle cx="130" cy="260" r="5"/><circle cx="150" cy="40" r="4"/><circle cx="20" cy="250" r="4"/>
    <circle cx="560" cy="60" r="5"/><circle cx="490" cy="120" r="7"/><circle cx="540" cy="200" r="6"/>
    <circle cx="470" cy="270" r="5"/><circle cx="450" cy="40" r="4"/><circle cx="585" cy="260" r="4"/>
  </g>

  <!-- assistant window -->
  <rect x="175" y="52" width="250" height="236" rx="18" fill="#ffffff"/>
  <path d="M175 70a18 18 0 0 1 18-18h214a18 18 0 0 1 18 18v28H175z" fill="#eef2ff"/>
  <circle cx="203" cy="76" r="13" fill="#6d28d9"/>
  <rect x="196" y="71" width="14" height="10" rx="3" fill="#fff"/>
  <circle cx="200" cy="76" r="1.8" fill="#6d28d9"/><circle cx="206" cy="76" r="1.8" fill="#6d28d9"/>
  <rect x="224" y="70" width="80" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="224" y="81" width="46" height="5" rx="2.5" fill="#22c55e"/>

  <!-- user question -->
  <rect x="270" y="112" width="140" height="34" rx="12" fill="#6d28d9"/>
  <rect x="284" y="122" width="100" height="5" rx="2.5" fill="#ede9fe"/>
  <rect x="284" y="132" width="70" height="5" rx="2.5" fill="#ede9fe"/>

  <!-- assistant reply with shipment card -->
  <rect x="190" y="158" width="190" height="112" rx="12" fill="#f1f5f9"/>
  <rect x="204" y="170" width="120" height="5" rx="2.5" fill="#64748b"/>
  <rect x="204" y="182" width="90" height="5" rx="2.5" fill="#94a3b8"/>
  <rect x="204" y="198" width="162" height="58" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- truck -->
  <g transform="translate(214 211)">
    <rect x="0" y="4" width="28" height="18" rx="2" fill="#2563eb"/>
    <path d="M28 10h9l6 7v5H28z" fill="#1d4ed8"/>
    <circle cx="8" cy="24" r="4" fill="#1e293b"/><circle cx="34" cy="24" r="4" fill="#1e293b"/>
  </g>
  <rect x="268" y="214" width="80" height="5" rx="2.5" fill="#1e293b"/>
  <rect x="268" y="226" width="56" height="5" rx="2.5" fill="#94a3b8"/>
  <rect x="268" y="238" width="86" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="268" y="238" width="60" height="6" rx="3" fill="#22c55e"/>

  <!-- sparkle -->
  <path d="M440 70 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#fde68a"/>
  <path d="M150 268 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#fde68a" opacity=".85"/>
</svg>
